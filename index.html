<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Med Sustainability Board Game</title>
<meta name="theme-color" content="#F6D97D">
<style>
  :root{
    --navy:#102f4b;
    --cream:#fffdf8;
    --yellow:#f8dfa0;
    --green:#5c9b57;
    --orange:#df8c31;
    --red:#d8614e;
    --gold:#c8951b;
    --line:rgba(16,47,75,.14);
    --muted:#66788a;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--navy);
    background:#f8dfa0;
  }
  .wrap{
    width:min(100% - 28px,680px);
    margin:0 auto;
    padding:56px 0 48px;
  }
  .home{
    text-align:center;
  }
  h1{
    margin:0;
    font-size:clamp(34px,8vw,54px);
    line-height:1;
    letter-spacing:-.045em;
  }
  .subtitle{
    margin:12px 0 30px;
    font-size:16px;
    color:rgba(16,47,75,.75);
  }
  .input-card{
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:24px;
    padding:22px;
    box-shadow:0 12px 30px rgba(16,47,75,.10);
  }
  form{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
  }
  input{
    min-height:56px;
    width:100%;
    border:2px solid rgba(16,47,75,.15);
    border-radius:16px;
    background:white;
    padding:0 16px;
    font-size:18px;
    color:var(--navy);
    outline:none;
  }
  input:focus{
    border-color:var(--navy);
    box-shadow:0 0 0 4px rgba(16,47,75,.08);
  }
  button{
    min-height:56px;
    border:0;
    border-radius:16px;
    padding:0 20px;
    font:inherit;
    font-weight:850;
    cursor:pointer;
  }
  .primary{
    background:var(--navy);
    color:white;
  }
  .secondary{
    width:100%;
    margin-top:16px;
    background:white;
    color:var(--navy);
    border:1px solid var(--line);
  }
  .error{
    min-height:20px;
    margin-top:9px;
    text-align:left;
    color:var(--red);
    font-size:13px;
    font-weight:750;
  }

  .screen{display:none}
  .screen.show{display:block}

  .event-card{
    overflow:hidden;
    border-radius:24px;
    box-shadow:0 12px 30px rgba(16,47,75,.10);
  }
  .head{
    padding:22px;
    color:white;
    background:var(--navy);
  }
  .head.action{background:var(--green)}
  .head.question{background:var(--orange)}
  .head.challenge{background:var(--red)}
  .head.special{background:linear-gradient(135deg,#b98414,#e5ad2d)}
  .head.goal{background:#168271}
  .head.start{background:var(--navy)}
  .space-label{
    font-size:12px;
    font-weight:900;
    opacity:.9;
    margin-bottom:7px;
    letter-spacing:.05em;
  }
  .event-title{
    margin:0;
    font-size:30px;
    line-height:1.06;
    letter-spacing:-.025em;
  }
  .body{
    padding:22px;
    background:var(--cream);
    border:1px solid var(--line);
    border-top:0;
  }
  .text{
    margin:0;
    font-size:16px;
    line-height:1.6;
  }
  .info{
    margin-top:15px;
    padding:14px;
    border-radius:15px;
    background:#edf7ea;
    border:1px solid rgba(92,155,87,.22);
    font-size:14px;
    line-height:1.5;
  }
  .instruction{
    margin-top:16px;
    padding:13px 15px;
    border-radius:15px;
    background:white;
    border:2px solid currentColor;
    font-size:17px;
    font-weight:900;
    text-align:center;
  }
  .question-text{
    margin:17px 0 11px;
    font-size:18px;
    font-weight:900;
    line-height:1.4;
  }
  .choices{
    display:grid;
    gap:10px;
  }
  .choice{
    min-height:54px;
    width:100%;
    text-align:left;
    padding:13px 14px;
    background:white;
    color:var(--navy);
    border:1px solid var(--line);
    border-radius:15px;
    line-height:1.4;
  }
  .choice[disabled]{cursor:default}
  .choice.correct{
    border:2px solid var(--green);
    background:#eef8ea;
  }
  .choice.wrong{
    border:2px solid var(--red);
    background:#fff0ed;
  }
  .feedback{
    display:none;
    margin-top:15px;
    padding:15px;
    border-radius:16px;
    font-size:14px;
    line-height:1.55;
  }
  .feedback.show{display:block}
  .feedback.correct{
    background:#eef8ea;
    border:1px solid rgba(92,155,87,.24);
  }
  .feedback.wrong{
    background:#fff0ed;
    border:1px solid rgba(216,97,78,.22);
  }
  .feedback h3{
    margin:0 0 5px;
    font-size:18px;
  }
  .correct-answer{
    margin-top:8px;
    font-weight:900;
  }
  .move{
    margin-top:10px;
    font-size:16px;
    font-weight:950;
  }
  @media(max-width:520px){
    .wrap{padding-top:34px}
    form{grid-template-columns:1fr}
    .primary{width:100%}
  }
</style>
</head>
<body>
<main class="wrap">
  <section id="home" class="home screen show">
    <h1>Club Med Sustainability</h1>
    <p class="subtitle">Enter the space number you landed on.</p>

    <div class="input-card">
      <form id="spaceForm">
        <input id="spaceInput" type="number" min="1" max="30" inputmode="numeric" placeholder="Space number (1–30)" aria-label="Space number">
        <button class="primary" type="submit">Open</button>
      </form>
      <div id="error" class="error" role="alert"></div>
    </div>
  </section>

  <section id="eventScreen" class="screen">
    <div class="event-card">
      <div id="head" class="head">
        <div id="spaceLabel" class="space-label"></div>
        <h2 id="eventTitle" class="event-title"></h2>
      </div>
      <div id="body" class="body"></div>
    </div>
  </section>
</main>

<script>
(() => {
  const home = document.getElementById('home');
  const eventScreen = document.getElementById('eventScreen');
  const form = document.getElementById('spaceForm');
  const input = document.getElementById('spaceInput');
  const error = document.getElementById('error');
  const head = document.getElementById('head');
  const spaceLabel = document.getElementById('spaceLabel');
  const eventTitle = document.getElementById('eventTitle');
  const body = document.getElementById('body');

  const spaces = {
    1:{type:'start',title:'Welcome!',text:'Your sustainability journey starts here. Roll the dice and enjoy the game.'},

    2:{type:'action',title:'Save Water',text:'A resort uses water every day for rooms, kitchens, gardens and laundry.',info:'Using water carefully helps reduce unnecessary resource use.'},

    3:{type:'question',title:'The Towel Question',text:'Washing towels every day uses water and energy.',question:'What is the best choice?',correct:1,choices:[
      {label:'A. Replace every towel every day',why:'This creates unnecessary water and energy use.',move:'Move back 1 space.'},
      {label:'B. Let guests reuse towels when possible',why:'This reduces unnecessary laundry while keeping guests comfortable.'},
      {label:'C. Stop providing towels completely',why:'This is not a practical balance between sustainability and guest comfort.',move:'Move back 1 space.'}
    ]},

    4:{type:'action',title:'Bye Bye Plastic',text:'Single-use plastic may only be used for a short time, but it can remain in the environment for much longer.',info:'Club Med has worked to reduce single-use plastic in its resorts.'},

    5:{type:'action',title:'Refill Stations',text:'Refill stations let guests use reusable bottles instead of taking a new plastic bottle each time.',info:'Small changes can reduce a large amount of plastic waste over time.'},

    6:{type:'action',title:'Protect Sea Turtles',text:'Some resorts are close to important turtle nesting areas.',info:'Protecting nesting areas helps preserve local biodiversity.'},

    7:{type:'question',title:'Turtle Nesting Night',text:'Sea turtles are nesting near the beach, but guests also want evening activities.',question:'What should the resort do?',correct:0,choices:[
      {label:'A. Protect the nesting area and adjust activities',why:'This protects wildlife while allowing the resort to adapt its guest activities.'},
      {label:'B. Move the eggs yourself to keep the beach open',why:'Wildlife should be handled using proper conservation methods, not simply moved for convenience.',move:'Move back 1 space.'},
      {label:'C. Keep all beach activities exactly the same',why:'This could disturb a sensitive nesting area.',move:'Move back 2 spaces.'}
    ]},

    8:{type:'action',title:'Protect Coral Reefs',text:'Coral reefs support many forms of marine life.',info:'Protecting and restoring coral reefs helps preserve marine biodiversity.'},

    9:{type:'challenge',title:'Beach Erosion',text:'Part of the beach has been damaged by coastal erosion.',info:'Climate-related changes can create serious challenges for coastal resorts.',move:'Move back 2 spaces.'},

    10:{type:'action',title:'Solar Energy',text:'Resorts need a lot of electricity to operate.',info:'Using solar energy can reduce reliance on conventional electricity sources.'},

    11:{type:'question',title:'Room Energy Upgrade',text:'Your resort wants to reduce electricity use in guest rooms.',question:'Which option is the most sustainable?',correct:0,choices:[
      {label:'A. Install smart room controls',why:'Smart controls can reduce unnecessary electricity use while keeping rooms comfortable.'},
      {label:'B. Keep decorative lights on all night',why:'This increases electricity use without helping sustainability.',move:'Move back 1 space.'},
      {label:'C. Use diesel generators as the normal power source',why:'This would increase direct fossil-fuel use and emissions.',move:'Move back 2 spaces.'}
    ]},

    12:{type:'action',title:'Electric Vehicles',text:'Resorts use vehicles to move staff, goods and guests.',info:'Electric vehicles can reduce direct emissions inside the resort.'},

    13:{type:'challenge',title:'High-Carbon Travel',text:'Many guests are using higher-carbon transport to reach the resort.',info:'Transport can be a major part of the environmental impact of tourism.',move:'Move back 1 space.'},

    14:{type:'action',title:'Travel More Thoughtfully',text:'Sustainability is not only about what happens inside the resort.',info:'How guests travel and how long they stay can also affect the environmental impact of a holiday.'},

    15:{type:'special',title:'Green Globe Mission',text:'Your resort is preparing for a sustainability certification review.',question:'What is Green Globe?',correct:1,choices:[
      {label:'A. Only a recycling program',why:'Green Globe covers much more than recycling alone.'},
      {label:'B. An international sustainability certification for tourism',why:'Green Globe evaluates sustainability practices across tourism businesses.',move:'Move forward 2 spaces.'},
      {label:'C. A logo with no standards',why:'Certification is based on standards and assessment.'}
    ]},

    16:{type:'question',title:'Food Waste Challenge',text:'Your buffet is producing too much food waste.',question:'What should the resort do first?',correct:1,choices:[
      {label:'A. Remove many dishes immediately without checking the cause',why:'It is better to understand what is being wasted before making a major change.'},
      {label:'B. Measure what food is being wasted',why:'Measuring the waste helps the resort make better decisions.'},
      {label:'C. Ignore the problem',why:'Ignoring waste does not help the resort improve.',move:'Move back 1 space.'}
    ]},

    17:{type:'action',title:'Smart Waste Monitoring',text:'Technology can help kitchen teams see what food is being wasted.',info:'Better information can help improve menu planning and reduce waste.'},

    18:{type:'challenge',title:'Food Waste Increased',text:'The buffet prepared much more food than guests needed today.',info:'Even sustainable systems can face setbacks that need to be corrected.',move:'Move back 1 space.'},

    19:{type:'action',title:'Green Farmers',text:'Working with local farmers can connect the resort more closely with the surrounding community.',info:'Local sourcing can support both the local economy and more responsible food systems.'},

    20:{type:'question',title:'Support Local Farmers?',text:'A nearby farmer wants to supply vegetables to the resort.',question:'What should the resort do?',correct:0,choices:[
      {label:'A. Support the farmer and buy locally when possible',why:'This can support local livelihoods and responsible sourcing.'},
      {label:'B. Import everything from far away because it is simpler',why:'This misses an opportunity to support the local community.',move:'Move back 1 space.'},
      {label:'C. Stop using vegetables',why:'Avoiding the problem is not a realistic sustainability solution.',move:'Move back 1 space.'}
    ]},

    21:{type:'special',title:'Green Farmers Achievement',text:'The resort has a chance to create a bigger impact through local agriculture.',question:'Which choice creates the strongest impact?',correct:0,choices:[
      {label:'A. Build a long-term partnership with a local sustainable farmer',why:'This supports the local economy and responsible sourcing together.',move:'Move forward 2 spaces.'},
      {label:'B. Always choose the farthest supplier',why:'This misses the local partnership opportunity.'},
      {label:'C. Avoid small farmers because cooperation takes effort',why:'Sustainability often requires long-term cooperation.',move:'Move back 1 space.'}
    ]},

    22:{type:'action',title:'Local Employment',text:'A resort can create jobs and opportunities for people living nearby.',info:'Supporting local communities is also an important part of sustainability.'},

    23:{type:'question',title:'Responsible Purchasing',text:'You need to choose a food supplier for the resort.',question:'Which option is the most responsible?',correct:0,choices:[
      {label:'A. Choose a local seasonal supplier with clear information',why:'This supports traceability and can also support the local economy.'},
      {label:'B. Choose a distant supplier with heavy packaging because it is convenient',why:'This may increase transport impact and packaging waste.',move:'Move back 1 space.'},
      {label:'C. Choose the cheapest option even if you know almost nothing about it',why:'Responsible sourcing also requires information and transparency.',move:'Move back 1 space.'}
    ]},

    24:{type:'action',title:'Train the Team',text:'Sustainability works better when staff understand what they are trying to achieve.',info:'Training helps turn sustainability plans into everyday actions.'},

    25:{type:'challenge',title:'Invasive Species Alert',text:'An invasive pest is damaging plants near the resort.',info:'Protecting biodiversity sometimes requires dealing with unexpected ecological threats.',move:'Move back 1 space.'},

    26:{type:'special',title:'Greener Together Mission',text:'You are planning a new Club Med resort.',question:'Which strategy is the strongest?',correct:1,choices:[
      {label:'A. Focus only on plastic and ignore other issues',why:'Sustainability involves more than one environmental issue.'},
      {label:'B. Combine energy, waste, biodiversity and community actions',why:'A stronger sustainability strategy connects several areas together.',move:'Move forward 3 spaces.'},
      {label:'C. Wait until problems happen before planning anything',why:'Sustainability is more effective when it is planned in advance.',move:'Move back 1 space.'}
    ]},

    27:{type:'action',title:'Community Volunteer Day',text:'Resort staff take part in a local community activity.',info:'Sustainability also includes positive relationships with local communities.'},

    28:{type:'challenge',title:'Water Stress',text:'Weather conditions are drier than usual and the resort needs to use water more carefully.',info:'Climate conditions can create real pressure on resort operations.',move:'Move back 1 space.'},

    29:{type:'question',title:'Resort Manager Challenge',text:'You are now managing a new resort.',question:'Which idea best describes sustainable tourism?',correct:1,choices:[
      {label:'A. Looking sustainable in advertisements',why:'Sustainability is about real practices, not only marketing.'},
      {label:'B. Balancing the environment, people, resources and responsible operations',why:'Sustainable tourism connects environmental and social responsibility.',move:'Move forward 1 space to the goal.'},
      {label:'C. Removing all comfort and fun for guests',why:'Sustainability can still provide a positive guest experience.'}
    ]},

    30:{type:'goal',title:'Greener Together!',text:'Congratulations! You reached the goal.',info:'You explored sustainability through energy, resources, biodiversity, food, communities and responsible decisions.'}
  };

  const typeNames = {
    start:'START',
    action:'ACTION',
    question:'QUESTION',
    challenge:'CHALLENGE',
    special:'SPECIAL',
    goal:'GOAL'
  };

  function showHome(){
    eventScreen.classList.remove('show');
    home.classList.add('show');
    input.value='';
    input.focus();
    const u = new URL(location.href);
    u.searchParams.delete('space');
    history.replaceState(null,'',u.toString());
  }

  function setupBack(){
    const back = body.querySelector('#back');
    if(back) back.addEventListener('click',showHome);
  }

  function renderStatic(space,data){
    head.className='head '+data.type;
    spaceLabel.textContent='SPACE '+String(space).padStart(2,'0')+' · '+typeNames[data.type];
    eventTitle.textContent=data.title;

    let html=`<p class="text">${data.text}</p>`;
    if(data.info) html+=`<div class="info">${data.info}</div>`;
    if(data.move) html+=`<div class="instruction">${data.move}</div>`;
    html+=`<button id="back" class="secondary" type="button">Enter another space</button>`;
    body.innerHTML=html;
    setupBack();
  }

  function renderQuestion(space,data){
    head.className='head '+data.type;
    spaceLabel.textContent='SPACE '+String(space).padStart(2,'0')+' · '+typeNames[data.type];
    eventTitle.textContent=data.title;

    body.innerHTML=`
      <p class="text">${data.text}</p>
      <div class="question-text">${data.question}</div>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback"></div>
      <button id="back" class="secondary" type="button">Enter another space</button>
    `;

    const choices = body.querySelector('#choices');
    const feedback = body.querySelector('#feedback');

    data.choices.forEach((choice,index)=>{
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='choice';
      btn.textContent=choice.label;
      btn.addEventListener('click',()=>{
        const all=[...choices.querySelectorAll('.choice')];
        all.forEach((b,i)=>{
          b.disabled=true;
          if(i===data.correct) b.classList.add('correct');
        });

        const isCorrect=index===data.correct;
        if(!isCorrect) btn.classList.add('wrong');

        const correctChoice=data.choices[data.correct];
        feedback.className='feedback show '+(isCorrect?'correct':'wrong');

        if(isCorrect){
          feedback.innerHTML=`
            <h3>Correct!</h3>
            <div>${choice.why}</div>
            ${choice.move?`<div class="move">${choice.move}</div>`:''}
          `;
        }else{
          feedback.innerHTML=`
            <h3>Not quite.</h3>
            <div>${choice.why}</div>
            <div class="correct-answer">Correct answer: ${correctChoice.label}</div>
            <div>${correctChoice.why}</div>
            ${choice.move?`<div class="move">${choice.move}</div>`:''}
          `;
        }
      },{once:true});
      choices.appendChild(btn);
    });

    setupBack();
  }

  function openSpace(value){
    const n=Number(value);
    if(!Number.isInteger(n)||n<1||n>30){
      error.textContent='Enter a number from 1 to 30.';
      return;
    }
    error.textContent='';
    const data=spaces[n];
    home.classList.remove('show');
    eventScreen.classList.add('show');

    if(data.type==='question'||data.type==='special') renderQuestion(n,data);
    else renderStatic(n,data);

    const u=new URL(location.href);
    u.searchParams.set('space',String(n));
    history.replaceState(null,'',u.toString());
    window.scrollTo({top:0,behavior:'smooth'});
  }

  form.addEventListener('submit',(e)=>{
    e.preventDefault();
    openSpace(input.value);
  });

  const params=new URLSearchParams(location.search);
  if(params.has('space')) openSpace(params.get('space'));
})();
</script>
</body>
</html>
